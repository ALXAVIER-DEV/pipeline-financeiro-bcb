version: 2
models:
  - name: indicadores_macroeconomicos
    description: "Indicadores macro mensais: Selic, IPCA, dólar, PIB e inadimplência"
    columns:
      - name: mes_ref
        description: "Mes de referencia do indicador"
        tests:
          - not_null
          - unique

      - name: selic_media_mes
        description: "Media da taxa Selic no mes de referencia"
        tests:
          - not_null

      - name: selic_anualizada_mes
        description: "Taxa Selic anualizada média no mês, em percentual"
        tests:
          - not_null

      - name: ipca_12m
        description: "IPCA acumulado em 12 meses, em percentual"

      - name: juros_real_estimado
        description: "Juro real anual estimado pela equação de Fisher"

      - name: pib_valor_mes
        description: "Valor mensal do PIB disponibilizado pelo BCB"

      - name: inadimplencia_media_mes
        description: "Taxa média mensal de inadimplência"

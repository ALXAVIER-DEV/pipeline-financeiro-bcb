  name: CI

  on:
    push:
      branches:
        - main
        - develop
        - "feature/**"
    pull_request:
      branches: [main, develop]

  jobs:
    lint-and-test:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install dependencies
          run: |
            pip install uv
            uv pip install -e ".[dev]" --system

        - name: Lint
          run: ruff check src/ tests/

        - name: Type check
          run: mypy src/

        - name: Tests
          run: pytest tests/ --cov=src --cov-report=xml -v

        - name: Coverage report
          uses: codecov/codecov-action@v4

    docker-e2e:
      runs-on: ubuntu-latest
      timeout-minutes: 30

      steps:
        - uses: actions/checkout@v4

        - name: Validate Compose
          run: docker compose config --quiet

        - name: Build shared image
          run: docker build --tag pipeline-financeiro-bcb:spark-local .

        - name: Start services and wait for healthchecks
          run: |
            docker compose up -d --no-build --wait --wait-timeout 300 \
              pipeline dagster dashboard
            docker compose ps

        - name: End-to-end test
          run: bash scripts/run-e2e.sh

        - name: Service logs
          if: failure()
          run: docker compose logs --no-color --tail 300

        - name: Stop services
          if: always()
          run: docker compose down --volumes --remove-orphans


[project]
  name = "data-engineering-template"
  version = "0.1.0"
  requires-python = ">=3.11,<3.13"

  dependencies = [
      "pyspark>=3.5,<4.0",
      "dbt-core>=1.8",
      "dagster>=1.7",
      "boto3>=1.34",
      "pydantic>=2.0",
      "loguru>=0.7",
      "pandas>=2.0",
      "requests>=2.28",
      "streamlit>=1.25",
  ]

  [project.optional-dependencies]
  dev = [
      "pytest>=8.0",
      "pytest-cov>=5.0",
      "ruff>=0.4",
      "mypy>=1.10",
      "pandas-stubs>=2.0",
      "great-expectations>=0.18",
  ]

  [tool.setuptools.packages.find]
  where = ["."]
  include = ["src*"]

  [tool.ruff]
  line-length = 88

  [tool.ruff.lint]
  select = ["E", "F", "I"]

  [tool.pytest.ini_options]
  testpaths = ["tests"]
  pythonpath = ["."]
  
  [tool.coverage.run]
   branch = true
   source = ["src"]

  [tool.coverage.report]
   show_missing = true
   fail_under = 80
